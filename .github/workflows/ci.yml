name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.88 must match rust-version in Cargo.toml (tonic 0.14 needs it).
        rust: ["1.88", stable]
    env:
      # Overrides the rust-toolchain.toml pin.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: http
      # rustclamp-core is a path dependency on ../core.
      - uses: actions/checkout@v4
        with:
          repository: rustclamp/core
          path: core
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check --all-targets --all-features --locked
        working-directory: http
      - run: cargo test --all-targets --all-features --locked
        working-directory: http
