[package]
name = "rustclamp-http"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Optional Axum and Tower integration for RustClamp HTTP interfaces."
repository = "https://github.com/rustclamp/http"
license = "MIT OR Apache-2.0"
homepage = "https://rustclamp.com"
documentation = "https://docs.rs/rustclamp-http"
readme = "README.md"
exclude = [".github/", ".gitignore", "rust-toolchain.toml"]
keywords = ["framework", "http", "axum", "web"]
categories = ["web-programming::http-server"]

[features]
ws = ["axum/ws"]
cors = ["tower-http/cors"]
access-log = ["tower-http/trace"]
rate-limit = []
grpc = ["axum/http2", "dep:tonic"]
idempotency = ["dep:sha2"]

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
bytes = "1.10"
futures-core = "0.3"
matchit = "0.8.4"
serde_json = "1"
sha2 = { version = "0.10", optional = true }
rustclamp-core = { version = "1.0.1", path = "../core" }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.29"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.6"
prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
